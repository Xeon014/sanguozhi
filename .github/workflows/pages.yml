name: Publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Release gate regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Release gate (sha / refs / smoke)
        run: python3 scripts/check-release-gate.py
  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Artifact this run already holds
        id: held
        run: |
          # The deployment lists artifacts once, through the Actions results
          # service, and fails at once when the artifact is not there yet. That
          # service takes in a freshly uploaded artifact late, so it is asked
          # directly here, with the same request. A re-run must not upload a
          # second artifact of the same name: the deployment refuses a run that
          # holds two. So a re-run first looks for what an earlier attempt
          # uploaded. When the service cannot be asked, the step steps aside and
          # the artifact is uploaded as before.
          origin=$(python3 -c 'import os; from urllib.parse import urlparse
          u = urlparse(os.environ.get("ACTIONS_RESULTS_URL", ""))
          print(f"{u.scheme}://{u.netloc}" if u.scheme and u.netloc else "")' || true)
          # The address of the service and the two ids come from what the runner
          # gives the job. Nothing here prints the token. A request that cannot
          # be made says why, once, so the log tells which link is broken.
          read -r run job <<< "$(printf '%s' "$ACTIONS_RUNTIME_TOKEN" | python3 -c '
          import base64, json, sys
          parts = sys.stdin.read().split(".")
          try:
              claims = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              scope = next(s for s in claims["scp"].split(" ") if s.startswith("Actions.Results:"))
              print(*scope.split(":")[1:3])
          except Exception:
              sys.exit(1)' || true)"
          RESPONSE=$(mktemp); ERRORS=$(mktemp); SAID=$(mktemp)
          say() { echo "cannot ask the Actions results service: $1" >&2; }
          count() {
            # artifacts named github-pages this run holds, or "unknown"
            if [ -z "$origin" ]; then
              [ -s "$SAID" ] || { say "the job has no address for it (ACTIONS_RESULTS_URL is empty)"; echo x > "$SAID"; }
              echo unknown; return
            fi
            if [ -z "$run" ]; then
              [ -s "$SAID" ] || { say "the runtime token carries no run and job ids"; echo x > "$SAID"; }
              echo unknown; return
            fi
            local body code status n
            body="{\"workflowRunBackendId\":\"$run\",\"workflowJobRunBackendId\":\"$job\"}"
            status=0
            code=$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
              "$origin/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" \
              -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" -H "Content-Type: application/json" \
              -d "$body" 2>"$ERRORS") || status=$?
            if [ "$status" != "0" ]; then
              [ -s "$SAID" ] || { say "curl exit $status: $(tr '\n' ' ' < "$ERRORS")"; echo x > "$SAID"; }
              echo unknown; return
            fi
            if [ "$code" != "200" ]; then
              [ -s "$SAID" ] || { say "http $code: $(head -c 300 "$RESPONSE" | tr '\n' ' ')"; echo x > "$SAID"; }
              echo unknown; return
            fi
            status=0
            n=$(python3 - "$RESPONSE" <<'ANSWER'
          import json, sys
          try:
              text = open(sys.argv[1], encoding="utf-8").read()
              named = [a for a in json.loads(text).get("artifacts", []) if a.get("name") == "github-pages"]
          except Exception as error:
              print("unparsable answer: %s; start of it: %s" % (str(error)[:120], text[:200].replace("\n", " ")), file=sys.stderr)
              sys.exit(1)
          print(len(named))
          ANSWER
          ) 2>"$ERRORS" || status=$?
            if [ "$status" != "0" ]; then
              [ -s "$SAID" ] || { say "$(tr '\n' ' ' < "$ERRORS")"; echo x > "$SAID"; }
              echo unknown; return
            fi
            echo "${n:-unknown}"
          }
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then exit 0; fi
          unknown=0
          for try in $(seq 1 18); do
            n=$(count)
            case "$n" in
              unknown) unknown=$((unknown + 1)); [ "$unknown" -lt 3 ] || exit 0 ;;
              0) ;;
              *) echo "found=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 5
          done
      - uses: actions/upload-pages-artifact@v4
        if: steps.held.outputs.found != 'true'
        with:
          path: site
      - name: Wait until the deployment can see the artifact
        run: |
          # The deployment looks the artifact up once, as soon as it starts,
          # and fails at once when it is not there. So ask the same service the
          # same question until exactly one artifact is listed. When the
          # service cannot be asked at all, wait the full time and leave the
          # lookup to the deployment, as it was before this step existed.
          origin=$(python3 -c 'import os; from urllib.parse import urlparse
          u = urlparse(os.environ.get("ACTIONS_RESULTS_URL", ""))
          print(f"{u.scheme}://{u.netloc}" if u.scheme and u.netloc else "")' || true)
          # The address of the service and the two ids come from what the runner
          # gives the job. Nothing here prints the token. A request that cannot
          # be made says why, once, so the log tells which link is broken.
          read -r run job <<< "$(printf '%s' "$ACTIONS_RUNTIME_TOKEN" | python3 -c '
          import base64, json, sys
          parts = sys.stdin.read().split(".")
          try:
              claims = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              scope = next(s for s in claims["scp"].split(" ") if s.startswith("Actions.Results:"))
              print(*scope.split(":")[1:3])
          except Exception:
              sys.exit(1)' || true)"
          RESPONSE=$(mktemp); ERRORS=$(mktemp); SAID=$(mktemp)
          say() { echo "cannot ask the Actions results service: $1" >&2; }
          count() {
            # artifacts named github-pages this run holds, or "unknown"
            if [ -z "$origin" ]; then
              [ -s "$SAID" ] || { say "the job has no address for it (ACTIONS_RESULTS_URL is empty)"; echo x > "$SAID"; }
              echo unknown; return
            fi
            if [ -z "$run" ]; then
              [ -s "$SAID" ] || { say "the runtime token carries no run and job ids"; echo x > "$SAID"; }
              echo unknown; return
            fi
            local body code status n
            body="{\"workflowRunBackendId\":\"$run\",\"workflowJobRunBackendId\":\"$job\"}"
            status=0
            code=$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
              "$origin/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" \
              -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" -H "Content-Type: application/json" \
              -d "$body" 2>"$ERRORS") || status=$?
            if [ "$status" != "0" ]; then
              [ -s "$SAID" ] || { say "curl exit $status: $(tr '\n' ' ' < "$ERRORS")"; echo x > "$SAID"; }
              echo unknown; return
            fi
            if [ "$code" != "200" ]; then
              [ -s "$SAID" ] || { say "http $code: $(head -c 300 "$RESPONSE" | tr '\n' ' ')"; echo x > "$SAID"; }
              echo unknown; return
            fi
            status=0
            n=$(python3 - "$RESPONSE" <<'ANSWER'
          import json, sys
          try:
              text = open(sys.argv[1], encoding="utf-8").read()
              named = [a for a in json.loads(text).get("artifacts", []) if a.get("name") == "github-pages"]
          except Exception as error:
              print("unparsable answer: %s; start of it: %s" % (str(error)[:120], text[:200].replace("\n", " ")), file=sys.stderr)
              sys.exit(1)
          print(len(named))
          ANSWER
          ) 2>"$ERRORS" || status=$?
            if [ "$status" != "0" ]; then
              [ -s "$SAID" ] || { say "$(tr '\n' ' ' < "$ERRORS")"; echo x > "$SAID"; }
              echo unknown; return
            fi
            echo "${n:-unknown}"
          }
          listed=0
          for try in $(seq 1 60); do
            n=$(count)
            echo "poll $try: $n artifact(s) named github-pages"
            case "$n" in
              unknown) ;;
              1) exit 0 ;;
              0) listed=1 ;;
              *) echo "::error::this run holds $n artifacts named github-pages; start a fresh run for the commit instead of re-running this one"
                 exit 1 ;;
            esac
            sleep 5
          done
          if [ "$listed" = "1" ]; then
            echo "::error::the Actions results service did not list the artifact within five minutes"
            exit 1
          fi
          echo "::warning::the Actions results service could not be asked; waited five minutes and left the lookup to the deployment"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
