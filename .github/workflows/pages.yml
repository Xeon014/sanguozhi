name: Publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Release gate regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Release gate (sha / refs / smoke)
        run: python3 scripts/check-release-gate.py
  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Artifact this run already holds
        id: held
        uses: actions/github-script@v9
        with:
          script: |
            // The deployment lists artifacts once, through the Actions results
            // service, and fails at once when the artifact is not there yet. That
            // service takes in a freshly uploaded artifact later than the public
            // listing does, so it is asked directly here, with the request the
            // deployment itself makes. The service address and the token are only
            // handed to actions, which is why these steps are actions too. Nothing
            // here prints the token; when the service cannot be asked, the log says
            // why, once.
            const origin = (process.env.ACTIONS_RESULTS_URL || '').replace(/\/+$/, '')
            let ids = {}
            try {
              const claims = JSON.parse(Buffer.from(process.env.ACTIONS_RUNTIME_TOKEN.split('.')[1], 'base64url').toString('utf8'))
              const scope = claims.scp.split(' ').find(item => item.startsWith('Actions.Results:'))
              ;[ids.run, ids.job] = scope.split(':').slice(1, 3)
            } catch (error) {}
            const ask = async () => {
              // { count }: artifacts named github-pages this run holds. { why }: it cannot be told.
              if (!origin || !ids.run) {
                return { count: null, why: !origin ? 'the job has no address for it (ACTIONS_RESULTS_URL is empty)'
                                                    : 'the runtime token carries no run and job ids' }
              }
              try {
                const response = await globalThis.fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ workflowRunBackendId: ids.run, workflowJobRunBackendId: ids.job }),
                  signal: AbortSignal.timeout(20000)
                })
                const text = await response.text()
                if (response.status !== 200) return { count: null, why: `http ${response.status}: ${text.slice(0, 300)}` }
                try {
                  return { count: (JSON.parse(text).artifacts || []).filter(item => item.name === 'github-pages').length }
                } catch (error) {
                  return { count: null, why: `unparsable answer: ${String(error.message).slice(0, 120)}; start of it: ${text.slice(0, 200)}` }
                }
              } catch (error) {
                return { count: null, why: `request failed: ${String(error.message || error).slice(0, 160)}` }
              }
            }
            const pause = () => new Promise(resolve => setTimeout(resolve, 5000))
            // A re-run must not upload a second artifact of the same name: the
            // deployment refuses a run that holds two. So a re-run first looks for
            // what an earlier attempt uploaded. When the service cannot be asked,
            // the step steps aside and the artifact is uploaded as before.
            if (Number(context.runAttempt) === 1) return
            let unknown = 0
            for (let attempt = 1; attempt <= 18; attempt++) {
              const { count, why } = await ask()
              if (count > 0) return core.setOutput('found', 'true')
              if (count === null && why && ++unknown >= 3) return core.info(`cannot ask the Actions results service: ${why}`)
              await pause()
            }
      - uses: actions/upload-pages-artifact@v4
        if: steps.held.outputs.found != 'true'
        with:
          path: site
      - name: Wait until the deployment can see the artifact
        uses: actions/github-script@v9
        with:
          script: |
            // The deployment lists artifacts once, through the Actions results
            // service, and fails at once when the artifact is not there yet. That
            // service takes in a freshly uploaded artifact later than the public
            // listing does, so it is asked directly here, with the request the
            // deployment itself makes. The service address and the token are only
            // handed to actions, which is why these steps are actions too. Nothing
            // here prints the token; when the service cannot be asked, the log says
            // why, once.
            const origin = (process.env.ACTIONS_RESULTS_URL || '').replace(/\/+$/, '')
            let ids = {}
            try {
              const claims = JSON.parse(Buffer.from(process.env.ACTIONS_RUNTIME_TOKEN.split('.')[1], 'base64url').toString('utf8'))
              const scope = claims.scp.split(' ').find(item => item.startsWith('Actions.Results:'))
              ;[ids.run, ids.job] = scope.split(':').slice(1, 3)
            } catch (error) {}
            const ask = async () => {
              // { count }: artifacts named github-pages this run holds. { why }: it cannot be told.
              if (!origin || !ids.run) {
                return { count: null, why: !origin ? 'the job has no address for it (ACTIONS_RESULTS_URL is empty)'
                                                    : 'the runtime token carries no run and job ids' }
              }
              try {
                const response = await globalThis.fetch(`${origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${process.env.ACTIONS_RUNTIME_TOKEN}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ workflowRunBackendId: ids.run, workflowJobRunBackendId: ids.job }),
                  signal: AbortSignal.timeout(20000)
                })
                const text = await response.text()
                if (response.status !== 200) return { count: null, why: `http ${response.status}: ${text.slice(0, 300)}` }
                try {
                  return { count: (JSON.parse(text).artifacts || []).filter(item => item.name === 'github-pages').length }
                } catch (error) {
                  return { count: null, why: `unparsable answer: ${String(error.message).slice(0, 120)}; start of it: ${text.slice(0, 200)}` }
                }
              } catch (error) {
                return { count: null, why: `request failed: ${String(error.message || error).slice(0, 160)}` }
              }
            }
            const pause = () => new Promise(resolve => setTimeout(resolve, 5000))
            // The deployment looks the artifact up once, as soon as it starts, and
            // fails at once when it is not there. So ask the same service the same
            // question until exactly one artifact is listed. When the service cannot
            // be asked at all, wait the full time and leave the lookup to the
            // deployment, as it was before this step existed.
            let listed = false
            let said = false
            for (let poll = 1; poll <= 60; poll++) {
              const { count, why } = await ask()
              core.info(`poll ${poll}: ${count === null ? 'unknown' : count} artifact(s) named github-pages`)
              if (count === 1) return
              if (count === null) {
                if (!said && why) {
                  core.info(`cannot ask the Actions results service: ${why}`)
                  said = true
                }
              } else if (count > 1) {
                throw new Error(`this run holds ${count} artifacts named github-pages; start a fresh run for the commit instead of re-running this one`)
              } else {
                listed = true
              }
              await pause()
            }
            if (listed) throw new Error('the Actions results service did not list the artifact within five minutes')
            core.warning('the Actions results service could not be asked; waited five minutes and left the lookup to the deployment')
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
